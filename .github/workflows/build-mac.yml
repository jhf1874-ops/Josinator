# Builds the Josinator on GitHub's Macs so you can get the plugin without installing Xcode.
# Actions tab -> latest run -> download the "Josinator-mac" artifact.
name: build-mac
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -- -quiet
      - name: Test DSP
        run: ctest --test-dir build -C Release --output-on-failure
      # Zip with ditto first: upload-artifact drops the executable bit inside the bundles.
      - name: Package
        run: |
          mkdir -p pkg/Josinator dist
          cp -R build/Josinator_artefacts/Release/VST3/Josinator.vst3 pkg/Josinator/
          cp -R build/Josinator_artefacts/Release/AU/Josinator.component pkg/Josinator/
          ditto -c -k --keepParent pkg/Josinator dist/Josinator-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Josinator-mac
          path: dist/Josinator-mac.zip
